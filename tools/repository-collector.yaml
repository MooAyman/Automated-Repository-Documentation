# ARK Tool: the repository collection capability exposed to agents.
#
# Backed by the `repository-collector` HTTP service defined in
# templates/repository-collector.yaml (source in tools/repository-collector/).
#
# The URL is a fully qualified cluster DNS name because the ARK controller that
# performs the call runs in the `ark-system` namespace, not in this one.
apiVersion: ark.mckinsey.com/v1alpha1
kind: Tool
metadata:
  name: repository-collector
  labels:
    project: repository-documentation
    component: tool
spec:
  type: http
  description: >-
    Collects a Git repository (GitHub, gitlab.com, or self-hosted GitLab HTTPS
    URL) into a filtered plain-text dump: repository name, directory tree,
    excluded-file reasons, and included file contents with relative paths.
    Secrets, binaries, caches, lockfiles, and oversize files are omitted.
    Included content is capped by per-file and total-content byte limits.
    An absolute path inside the collector container is accepted as an internal
    collector capability; it is not normal pipeline input. Call this once per
    repository before writing any documentation; the dump is the only
    trustworthy description of the collected contents.
  inputSchema:
    type: object
    properties:
      repository:
        type: string
        description: >-
          The repository to collect: an https Git URL (GitHub, gitlab.com, or
          self-hosted GitLab, for example https://github.com/owner/name,
          https://gitlab.com/group/name, or
          https://gitlab.example.com/group/project.git). Do not include
          credentials in the URL. An absolute path is only valid inside the
          collector container; do not pass a workstation path as pipeline input.
      ref:
        type: string
        description: >-
          Optional Git ref: a branch name, a tag name, or a commit SHA. Leave
          empty to use the repository's default branch. Do not guess a branch
          name. If the ref does not exist, collection fails; it will not fall
          back to another ref.
    required:
      - repository
  http:
    url: http://repository-collector.default.svc.cluster.local:8080/collect
    method: POST
    timeout: 300s
    headers:
      - name: Content-Type
        value:
          value: application/json
    body: |
      {
        "repository": "{{.input.repository}}",
        "ref": "{{if .input.ref}}{{.input.ref}}{{end}}",
        "max_file_bytes": {{.max_file_bytes}},
        "max_total_bytes": {{.max_total_bytes}}
      }
    bodyParameters:
      - name: max_file_bytes
        value: "80000"
      - name: max_total_bytes
        value: "250000"
