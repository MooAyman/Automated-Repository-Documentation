# ARK Tool: deterministic HTML renderer for Agent structured documentation JSON.
#
# Called by Agent/repository-pipeline. The documentation Agent cannot call this
# tool in the same turn: ARK 0.1.68 treats Agent.spec.outputSchema as that
# Agent's final response.
#
# Pipeline contract: pass the nested documentation object (the six outputSchema
# fields) plus repositoryName. The HTTP body printf-quotes each string field so
# the body stays valid JSON even if a field is truncated. Do not pass one
# documentationJson blob; interpolating a truncated JSON string yields HTTP 400.
apiVersion: ark.mckinsey.com/v1alpha1
kind: Tool
metadata:
  name: documentation-renderer
  labels:
    project: repository-documentation
    component: tool
spec:
  type: http
  description: >-
    Renders structured repository documentation as a standalone HTML
    document. The pipeline passes the nested documentation object from the
    documentation Agent. Does not call a language model.
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      persist:
        type: boolean
        description: >-
          Unused by the pipeline HTTP body. The nested documentation path
          always writes the HTML artifact and returns JSON {filename, path, bytes}
          (the body template sets persist true).
      repositoryName:
        type: string
        description: >-
          Optional repository name used as the HTML filename (for example
          github-mcp-chatbot). Do not include a path.
      documentation:
        type: object
        description: >-
          Six-section document from the documentation Agent. Same shape as
          that Agent's outputSchema. Pass these fields; do not wrap them in
          a JSON string.
        additionalProperties: false
        required:
          - repositoryOverview
          - repositoryStructure
          - toolsAndTechnologies
          - coreConceptsAndArchitecture
          - categorizedTechnicalInformation
          - developerOnboardingGuide
        properties:
          repositoryOverview:
            type: object
            additionalProperties: false
            required: [summary, quickStart]
            properties:
              summary: { type: string }
              quickStart: { type: string }
          repositoryStructure: { type: string }
          toolsAndTechnologies: { type: string }
          coreConceptsAndArchitecture:
            type: object
            additionalProperties: false
            required: [summary, requestFlow, buildAndPackagingFlow]
            properties:
              summary: { type: string }
              requestFlow: { type: string }
              buildAndPackagingFlow: { type: string }
          categorizedTechnicalInformation:
            type: object
            additionalProperties: false
            required:
              - mainApisAndEndpoints
              - mainServicesAndMediators
              - dtosSchemasMetadata
              - securityComponents
              - configurations
              - entryPoints
              - tests
              - risksAndTechnicalDebt
            properties:
              mainApisAndEndpoints: { type: string }
              mainServicesAndMediators: { type: string }
              dtosSchemasMetadata: { type: string }
              securityComponents: { type: string }
              configurations: { type: string }
              entryPoints: { type: string }
              tests: { type: string }
              risksAndTechnicalDebt: { type: string }
          developerOnboardingGuide:
            type: object
            additionalProperties: false
            required:
              - first30Minutes
              - howToInvestigateAProductionBug
              - criticalFiles
              - commonMistakes
            properties:
              first30Minutes: { type: string }
              howToInvestigateAProductionBug: { type: string }
              criticalFiles: { type: string }
              commonMistakes: { type: string }
  http:
    url: http://documentation-renderer.default.svc.cluster.local:8080/render
    method: POST
    timeout: 60s
    headers:
      - name: Content-Type
        value:
          value: application/json
    body: |
      {"documentation":{"repositoryOverview":{"summary":{{printf "%q" .input.documentation.repositoryOverview.summary}},"quickStart":{{printf "%q" .input.documentation.repositoryOverview.quickStart}}},"repositoryStructure":{{printf "%q" .input.documentation.repositoryStructure}},"toolsAndTechnologies":{{printf "%q" .input.documentation.toolsAndTechnologies}},"coreConceptsAndArchitecture":{"summary":{{printf "%q" .input.documentation.coreConceptsAndArchitecture.summary}},"requestFlow":{{printf "%q" .input.documentation.coreConceptsAndArchitecture.requestFlow}},"buildAndPackagingFlow":{{printf "%q" .input.documentation.coreConceptsAndArchitecture.buildAndPackagingFlow}}},"categorizedTechnicalInformation":{"mainApisAndEndpoints":{{printf "%q" .input.documentation.categorizedTechnicalInformation.mainApisAndEndpoints}},"mainServicesAndMediators":{{printf "%q" .input.documentation.categorizedTechnicalInformation.mainServicesAndMediators}},"dtosSchemasMetadata":{{printf "%q" .input.documentation.categorizedTechnicalInformation.dtosSchemasMetadata}},"securityComponents":{{printf "%q" .input.documentation.categorizedTechnicalInformation.securityComponents}},"configurations":{{printf "%q" .input.documentation.categorizedTechnicalInformation.configurations}},"entryPoints":{{printf "%q" .input.documentation.categorizedTechnicalInformation.entryPoints}},"tests":{{printf "%q" .input.documentation.categorizedTechnicalInformation.tests}},"risksAndTechnicalDebt":{{printf "%q" .input.documentation.categorizedTechnicalInformation.risksAndTechnicalDebt}}},"developerOnboardingGuide":{"first30Minutes":{{printf "%q" .input.documentation.developerOnboardingGuide.first30Minutes}},"howToInvestigateAProductionBug":{{printf "%q" .input.documentation.developerOnboardingGuide.howToInvestigateAProductionBug}},"criticalFiles":{{printf "%q" .input.documentation.developerOnboardingGuide.criticalFiles}},"commonMistakes":{{printf "%q" .input.documentation.developerOnboardingGuide.commonMistakes}}}},"persist": true, "repositoryName": {{if .input.repositoryName}}{{printf "%q" .input.repositoryName}}{{else}}""{{end}}}
