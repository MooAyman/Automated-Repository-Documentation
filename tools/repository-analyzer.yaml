# ARK Tool: deterministic Python AST analysis of already-sanitized source.
#
# Host-side incremental/full sidecar analysis posts dump directly to /analyze.
# The documentation Agent must not pass the collector dump through this Tool:
# interpolating dump into the model tool call overflows gpt-4o-mini context.
# Compact filesJson only. Empty files analyzes nothing.
apiVersion: ark.mckinsey.com/v1alpha1
kind: Tool
metadata:
  name: repository-analyzer
  labels:
    project: repository-documentation
    component: tool
spec:
  type: http
  description: >-
    Analyzes already-sanitized per-file Python source with a conservative AST.
    Pass filesJson, a JSON array of {path, content}. Do not pass a collector
    dump, repository URL, or unsanitized source. Host-side analysis may POST
    dump directly to /analyze. Additional evidence only; the collector dump
    remains the source of truth.
  inputSchema:
    type: object
    additionalProperties: false
    properties:
      filesJson:
        type: string
        description: >-
          JSON array of {path, content} objects whose content is already
          sanitized. Omit or use [] rather than embedding a collector dump.
  http:
    url: http://repository-analyzer.default.svc.cluster.local:8080/analyze
    method: POST
    timeout: 60s
    headers:
      - name: Content-Type
        value:
          value: application/json
    body: |
      {{if .input.filesJson}}{"files": {{.input.filesJson}}}{{else}}{"files":[]}{{end}}
