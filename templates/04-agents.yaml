{{/*
Agents - Deploy after tools so they can reference Tool CRs.
*/}}
{{- if not .Values.excludeResources }}
{{- range $path, $_ := .Files.Glob "agents/*.yaml" }}
---
{{ $content := $.Files.Get $path }}
{{- regexReplaceAll "(?m)^metadata:" $content "metadata:\n  annotations:\n    \"helm.sh/hook\": pre-install,pre-upgrade\n    \"helm.sh/hook-weight\": \"0\"\n    \"helm.sh/hook-delete-policy\": before-hook-creation" }}
{{- end }}
{{- end }}