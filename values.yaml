# configuration values for the Helm chart
# Values consumed by templates/. Install namespace comes from `helm --namespace`
# (Tool URLs are hardcoded to default.svc.cluster.local).

project:
  name: repository-documentation

# HTTP service backing the `repository-collector` ARK Tool.
# `name` and `port` must stay in sync with the URL in tools/repository-collector.yaml.
collector:
  enabled: true
  name: repository-collector
  port: 8080
  replicas: 1
  image:
    repository: localhost:5000/repository-documentation-repository-collector
    tag: m17
    # Docker Desktop Kubernetes caches :latest; bump this tag when the image changes.
    pullPolicy: IfNotPresent
  # Disk budget for transient clones (mounted at /tmp).
  workspaceSizeLimit: 2Gi
  # Restrict local-path collection to this directory. Empty means local paths are
  # resolved anywhere inside the container (which only ever holds clones).
  localRepoRoot: ""
  # Optional extra detector. Off by default; the collector runs without it.
  # When enabled, POST {"text": "<already sanitized dump>"} to url and expect
  # {"detections": [{"type": "secret", "start": 0, "end": 4}]}.
  localLlm:
    enabled: false
    url: ""
    timeoutSeconds: 3
  resources:
    limits:
      memory: "1Gi"
      cpu: "1000m"
    requests:
      memory: "256Mi"
      cpu: "100m"

# GitLab authentication for private (including self-hosted) repositories.
# Leave tokenSecret.name empty so public GitHub collection keeps working.
#
# Create the secret yourself — never put a token in this file or in the Tool YAML:
#   kubectl create secret generic gitlab-token \
#     --from-literal=token=<GITLAB_PAT> \
#     --namespace default
# Then: --set gitlab.tokenSecret.name=gitlab-token
gitlab:
  tokenSecret:
    name: ""
    key: token

# HTTP service backing the `repository-analyzer` ARK Tool.
# `name` and `port` must stay in sync with tools/repository-analyzer.yaml.
# Accepts already-sanitized source only; it does not clone repositories.
analyzer:
  enabled: true
  name: repository-analyzer
  port: 8080
  replicas: 1
  image:
    repository: localhost:5000/repository-documentation-repository-analyzer
    tag: m4
    pullPolicy: IfNotPresent
  workspaceSizeLimit: 64Mi
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "64Mi"
      cpu: "50m"

# HTTP service backing the `repository-map` ARK Tool.
# `name` and `port` must stay in sync with tools/repository-map.yaml.
# Accepts already-sanitized analyzer JSON only; it does not clone or parse source.
mapper:
  enabled: true
  name: repository-map
  port: 8080
  replicas: 1
  image:
    repository: localhost:5000/repository-documentation-repository-map
    tag: m4
    pullPolicy: IfNotPresent
  workspaceSizeLimit: 64Mi
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "64Mi"
      cpu: "50m"

# HTTP service backing the `documentation-renderer` ARK Tool.
# `name` and `port` must stay in sync with tools/documentation-renderer.yaml.
renderer:
  enabled: true
  name: documentation-renderer
  port: 8080
  replicas: 1
  image:
    repository: localhost:5000/repository-documentation-documentation-renderer
    tag: m9
    pullPolicy: IfNotPresent
  workspaceSizeLimit: 64Mi
  output:
    path: /mnt/output
    sizeLimit: 256Mi
    # Docker Desktop Kubernetes (kind node) cannot hostPath a Windows folder.
    # hostDocker publishes the renderer on the Windows host with:
    #   docker run -d --name documentation-renderer-host --restart=unless-stopped
    #     -p 18080:8080 -e OUTPUT_DIR=/mnt/output
    #     -v C:\Users\moham\source\repos\repository-documentation\out:/mnt/output
    #     localhost:5000/repository-documentation-documentation-renderer:m8
    # The in-cluster Service keeps the Tool URL unchanged.
    hostDocker: true
    # Host bind path for that docker run. Not interpolated by Helm templates.
    windowsPath: C:\Users\moham\source\repos\repository-documentation\out
    hostIP: 192.168.65.254
    hostPort: 18080
    # Used only when hostDocker is false.
    hostPath: ""
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "64Mi"
      cpu: "50m"

security:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 2000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# LOG_LEVEL on collector, analyzer, map, and renderer containers.
logging:
  level: INFO

labels: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""
