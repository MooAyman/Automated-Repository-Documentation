# End-to-end test of the first milestone:
#   repository URL -> agent -> repository-collector tool -> LLM -> documentation
apiVersion: ark.mckinsey.com/v1alpha1
kind: Query
metadata:
  name: document-github-mcp-chatbot
  labels:
    project: repository-documentation
    type: e2e
    target: agent
spec:
  input: "Generate developer documentation for https://github.com/MooAyman/github-mcp-chatbot"
  target:
    type: agent
    name: repository-documentation
  timeout: 10m
